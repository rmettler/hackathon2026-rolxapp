<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RolX Authentication Complete</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --fg: #1a1a2e;
      --card-bg: #fff;
      --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      --icon-bg: #e8f5e9;
      --icon-stroke: #2e7d32;
      --text-secondary: #333;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a2e;
        --fg: #fff;
        --card-bg: #2a2a3e;
        --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        --icon-bg: #2e7d32;
        --icon-stroke: #e8f5e9;
        --text-secondary: #eee;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 3rem 2.5rem;
      width: min(400px, calc(100vw - 2rem));
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--icon-bg);
      margin-bottom: 1.25rem;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      stroke: var(--icon-stroke);
    }
    h1 {
      margin-bottom: 0.75rem;
      font-size: 1.2rem;
      font-weight: 600;
    }
    p {
      margin: 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" />
      </svg>
    </div>
    <h1>RolX Authentication Complete</h1>
    <p>You may close this tab and return to the application.</p>
  </div>
</body>
</html>
