[workspace]
members         = ["rolx-core", "rolx-ui", "rolxapp-dioxus", "rolx-mobile", "xtask"]
# The Dioxus apps are heavy to build, so plain cargo commands skip them. Use `-p <name>`.
default-members = [".", "rolx-core"]

[package]
edition = "2024"
name    = "rolxapp"
version = "0.1.0"

[package.metadata.rolx-server]
url = "https://dev.azure.com/MFEngineeringAG/RolX/_git/RolX"
rev = "0ba703474b6a5e02e331d1e8f085640b60b983c2"
dir = "rolx-server"

[dependencies]
anyhow           = "1"
chrono           = "0.4"
clap             = { version = "4", features = ["derive", "env"] }
rolx-core        = { path = "rolx-core" }
tokio            = { version = "1", features = ["rt-multi-thread", "macros"] }
toml             = "1.1"

[features]
default = []
uncensored_logs = ["rolx-core/uncensored_logs"]
