[workspace]
members         = ["crates/*", "apps/*", "xtask"]
default-members = ["apps/cli"]
resolver        = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata.rolx-server]
url = "https://dev.azure.com/MFEngineeringAG/RolX/_git/RolX"
rev = "0ba703474b6a5e02e331d1e8f085640b60b983c2"
dir = "rolx-server"

[workspace.dependencies]
anyhow             = "1"
axum               = "0.8"
base64             = "0.23"
chrono             = { version = "0.4", features = ["serde"] }
clap               = { version = "4", features = ["derive"] }
dioxus             = { version = "=0.8.0-alpha.3", default-features = false }
dirs               = "7"
enigo              = "0.6"
open               = "5"
rand               = "0.10"
regex              = "1"
reqwest            = { version = "0.13", default-features = false }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sha2               = { version = "0.11", features = ["oid"] }
tempfile           = "3"
thiserror          = "2"
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }
toml               = "1.1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url                = "2"
urlencoding        = "2"
xcap               = "0.9"
