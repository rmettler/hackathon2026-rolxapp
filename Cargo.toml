[workspace]
members = ["xtask", "rolx-mobile"]

[package]
edition = "2024"
name    = "rolxapp"
version = "0.1.0"

[package.metadata.rolx-server]
url = "https://dev.azure.com/MFEngineeringAG/RolX/_git/RolX"
rev = "0ba703474b6a5e02e331d1e8f085640b60b983c2"
dir = "rolx-server"

[dependencies]
anyhow           = "1"
base64           = "0.23"
chrono           = { version = "0.4", features = ["serde"] }
clap             = { version = "4", features = ["derive", "env"] }
dirs             = "7"
open             = "5"
rand             = "0.10"
reqwest          = { version = "0.13", features = ["form", "json", "rustls"], default-features = false }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
sha2             = { version = "0.11", features = ["oid"] }
thiserror        = "2"
tokio            = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml             = "1.1"
urlencoding      = "2"

[features]
default = []
uncensored_logs = []
