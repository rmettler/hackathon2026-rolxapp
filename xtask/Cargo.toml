[package]
edition   = "2024"
name      = "xtask"
version   = "0.1.0"
publish   = false

[dependencies]
# Only for `fake-server`; already in the workspace via the Dioxus apps, so nothing new to download.
axum       = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono     = "0.4"
clap       = { version = "4", features = ["derive"] }
dirs       = "7"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["net", "rt"] }
toml       = "1.1"

[dev-dependencies]
# Checks that the fake server and session match what the apps parse.
rolx-core = { path = "../rolx-core" }
tokio     = { version = "1", features = ["macros", "net", "rt"] }
