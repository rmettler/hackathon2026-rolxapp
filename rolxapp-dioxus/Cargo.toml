[package]
edition = "2024"
name    = "rolxapp-dioxus"
version = "0.1.0"
publish = false

[dependencies]
anyhow    = "1"
base64    = "0.22"
chrono    = "0.4"
dioxus    = { version = "0.7", features = ["desktop"] }
rolx-core = { path = "../rolx-core" }
serde     = { version = "1", features = ["derive"] }
tokio     = { version = "1", features = ["sync", "time"] }
