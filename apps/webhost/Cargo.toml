[package]
edition.workspace = true
name              = "rolxapp-webhost"
version.workspace = true

[dependencies]
axum.workspace       = true
clap                 = { workspace = true, features = ["env"] }
# `ring`: it cross-compiles without cmake or a C assembler toolchain, unlike rustls' default.
reqwest              = { workspace = true, features = ["rustls-no-provider", "stream"] }
rustls               = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
tokio                = { workspace = true, features = ["net", "time"] }
tower-http           = { version = "0.6", features = ["fs", "set-header"] }
tracing.workspace    = true
tracing-subscriber.workspace = true
urlencoding.workspace = true
webpki-root-certs    = "1"

[dev-dependencies]
chrono.workspace   = true
reqwest            = { workspace = true, features = ["json"] }
rolx-mock          = { path = "../../crates/rolx-mock" }
tempfile.workspace = true
tokio              = { workspace = true, features = ["io-util"] }
