[package]
edition.workspace = true
name              = "rolxapp-web"
version.workspace = true

[dependencies]
dioxus            = { workspace = true, features = ["launch", "logger", "web"] }
reqwest           = { workspace = true, features = ["json"] }
rolx-core         = { path = "../../crates/rolx-core", default-features = false }
rolx-ui           = { path = "../../crates/rolx-ui" }
serde.workspace   = true
serde_json.workspace = true
tracing.workspace = true
futures-util.workspace = true
gloo-timers          = { version = "0.3", features = ["futures"] }
js-sys               = "0.3"
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
web-sys           = { version = "0.3", features = ["Document", "Element", "HtmlHeadElement", "HtmlScriptElement", "Location", "Storage", "Window"] }
