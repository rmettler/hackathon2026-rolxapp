[package]
edition.workspace = true
name              = "rolxapp-web"
version.workspace = true

[dependencies]
dioxus            = { workspace = true, features = ["launch", "logger", "web"] }
# Its `web` feature makes the calendar's clock work in the browser.
dioxus-primitives = { workspace = true, features = ["web"] }
reqwest           = { workspace = true, features = ["json"] }
rolx-core         = { path = "../../crates/rolx-core", default-features = false }
rolx-ui           = { path = "../../crates/rolx-ui" }
serde.workspace   = true
serde_json.workspace = true
tracing.workspace = true
wasm-bindgen         = "0.2"
web-sys           = { version = "0.3", features = ["Location", "Storage", "Window"] }
