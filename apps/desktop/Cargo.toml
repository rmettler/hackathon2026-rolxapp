[package]
edition.workspace = true
name              = "rolxapp-desktop"
version.workspace = true

[dependencies]
arboard       = { version = "3", default-features = false }
dioxus        = { workspace = true, features = ["launch", "logger", "native"] }
open.workspace = true
reqwest       = { workspace = true, features = ["json", "rustls"] }
rolx-auth     = { path = "../../crates/rolx-auth" }
rolx-core     = { path = "../../crates/rolx-core" }
rolx-ui       = { path = "../../crates/rolx-ui" }

[dev-dependencies]
blitz-dom    = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }

[features]
default         = []
uncensored_logs = ["rolx-auth/uncensored_logs", "rolx-core/uncensored_logs"]
